<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="企鵝的麻吉" />
<meta name="theme-color" content="#141233" />
<title>企鵝的麻吉 · 唯美海洋語音交友與樂園</title>
<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  input, textarea { user-select: text; }

  /* 主題變數：星河藍紫（預設） */
  :root {
    --bg-outer: radial-gradient(circle at 18% 12%, #2e2a72 0%, #141233 58%, #070614 100%);
    --bg-shell: linear-gradient(180deg, #1b1846 0%, #110f30 45%, #0b0a22 100%);
    --border-shell: rgba(139, 92, 246, 0.45);
    --glass-bg: rgba(28, 24, 68, 0.78);
    --glass-elevated: rgba(40, 34, 92, 0.88);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-border-strong: rgba(167, 139, 250, 0.36);
    --card-sub: rgba(15, 13, 40, 0.65);
    --text-main: #f8fafc;
    --text-sub: #cbd5e1;
    --text-muted: #94a3b8;
    --accent: #8b5cf6;
    --accent-2: #6366f1;
    --accent-grad: linear-gradient(135deg, #8b5cf6, #6366f1);
    --gold-hi: #fbbf24;
    --gold-grad: linear-gradient(135deg, #fde68a, #f59e0b);
    --gold-soft: rgba(251, 191, 36, 0.16);
    --nav-bg: rgba(14, 12, 36, 0.94);
  }

  /* 主題變數：黑金奢華 */
  body.theme-blackgold {
    --bg-outer: radial-gradient(circle at 18% 12%, #292214 0%, #110e09 58%, #050403 100%);
    --bg-shell: linear-gradient(180deg, #1c1811 0%, #120f0a 45%, #090805 100%);
    --border-shell: rgba(245, 158, 11, 0.45);
    --glass-bg: rgba(32, 26, 17, 0.82);
    --glass-elevated: rgba(46, 37, 23, 0.9);
    --glass-border: rgba(251, 191, 36, 0.16);
    --glass-border-strong: rgba(245, 158, 11, 0.42);
    --card-sub: rgba(18, 14, 9, 0.72);
    --text-main: #fef3c7;
    --text-sub: #fde68a;
    --text-muted: #a8a29e;
    --accent: #f59e0b;
    --accent-2: #d97706;
    --accent-grad: linear-gradient(135deg, #f59e0b, #b45309);
    --gold-hi: #fde047;
    --gold-grad: linear-gradient(135deg, #fef08a, #eab308);
    --gold-soft: rgba(245, 158, 11, 0.18);
    --nav-bg: rgba(15, 12, 8, 0.95);
  }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg-outer); color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden;
  }

  .app-shell {
    position: relative; width: 100%; max-width: 460px; height: 100dvh; margin: 0 auto;
    background: var(--bg-shell);
    border-left: 1px solid var(--border-shell);
    border-right: 1px solid var(--border-shell);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
  }

  /* 頂部標題欄 */
  .top-bar {
    flex-shrink: 0; padding: calc(env(safe-area-inset-top, 10px) + 8px) 14px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: rgba(10, 9, 28, 0.55); border-bottom: 1px solid var(--glass-border);
    backdrop-filter: blur(12px); z-index: 20;
  }
  .brand-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .logo-badge {
    width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
    background: var(--accent-grad); border: 1px solid rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff; box-shadow: 0 4px 14px rgba(139, 92, 246, 0.45);
  }
  .brand-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .role-pill {
    font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 700;
    background: var(--accent-grad); color: #fff; cursor: pointer;
  }
  .role-pill.is-admin { background: var(--gold-grad); color: #1f1600; }
  .brand-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; display: inline-block; }

  .top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .pill-btn {
    border: 1px solid var(--glass-border-strong); background: var(--glass-elevated);
    color: var(--text-main); font-size: 11px; font-weight: 700;
    padding: 6px 10px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .pill-btn:active { transform: scale(0.95); }

  /* 主滾動內容區 */
  .main-scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 10px 12px 92px;
    -webkit-overflow-scrolling: touch;
  }
  .main-scroll::-webkit-scrollbar { width: 0; display: none; }

  .tab-panel { display: none; flex-direction: column; gap: 10px; }
  .tab-panel.active { display: flex; }

  /* 通用玻璃卡片 */
  .glass-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border-strong);
    border-radius: 16px; padding: 11px 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  /* 個人資訊卡 */
  .profile-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .avatar-wrap {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--gold-hi); background: var(--card-sub);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; overflow: hidden; cursor: pointer; position: relative;
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .profile-mid { flex: 1; min-width: 0; }
  .name-line { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .user-nick { font-size: 14px; font-weight: 800; max-width: 115px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-chip {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--glass-border); background: var(--glass-elevated);
    color: var(--text-main); cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
  }
  .mini-chip.gold { background: var(--gold-soft); border-color: var(--gold-hi); color: var(--gold-hi); }
  .lvl-line { display: flex; align-items: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .lvl-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--card-sub); border: 1px solid var(--glass-border); }
  .diamond-box {
    text-align: right; background: var(--card-sub); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 6px 10px; flex-shrink: 0;
  }
  .diamond-lbl { font-size: 10px; color: var(--text-muted); }
  .diamond-val { font-size: 15px; font-weight: 900; color: var(--gold-hi); margin-top: 1px; }

  /* 語音麥位網格 */
  .room-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .room-name { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .mic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mic-slot {
    background: var(--card-sub); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 7px 4px; text-align: center; cursor: pointer;
    position: relative; transition: transform 0.12s;
  }
  .mic-slot:active { transform: scale(0.95); }
  .mic-slot.occupied { border-color: var(--accent); background: rgba(139, 92, 246, 0.14); }
  .mic-avatar {
    width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 4px;
    background: rgba(255,255,255,0.06); border: 1.5px solid var(--glass-border-strong);
    display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden;
  }
  .mic-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .mic-slot.speaking .mic-avatar { border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.65); }
  .mic-nick { font-size: 10px; font-weight: 700; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 進房歡迎橫幅與公屏 */
  .welcome-banner {
    display: none; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 10px; border-radius: 10px; margin-bottom: 7px; font-size: 11px; font-weight: 800;
    background: linear-gradient(90deg, rgba(251,191,36,0.22), rgba(139,92,246,0.28), rgba(251,191,36,0.22));
    border: 1px solid var(--gold-hi); color: #fef08a;
    animation: bannerPop 0.3s ease;
  }
  .welcome-banner.show { display: flex; }
  @keyframes bannerPop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .chat-box {
    height: 82px; overflow-y: auto; background: var(--card-sub);
    border: 1px solid var(--glass-border); border-radius: 11px;
    padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; font-size: 11px;
  }
  .chat-msg { line-height: 1.35; word-break: break-all; }
  .chat-tag {
    display: inline-block; font-size: 9px; font-weight: 800; padding: 1px 5px;
    border-radius: 4px; background: var(--gold-soft); color: var(--gold-hi); margin-right: 4px;
  }
  .chat-input-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .mic-toggle-btn {
    padding: 7px 10px; border-radius: 999px; font-size: 11px; font-weight: 800;
    border: 1px solid #10b981; background: rgba(16, 185, 129, 0.16); color: #6ee7b7;
    cursor: pointer; flex-shrink: 0;
  }
  .mic-toggle-btn.on { background: #10b981; color: #042f2e; }
  .chat-input {
    flex: 1; min-width: 0; background: var(--card-sub); border: 1px solid var(--glass-border);
    border-radius: 999px; padding: 7px 12px; color: var(--text-main); font-size: 12px; outline: none;
  }
  .send-btn {
    padding: 7px 14px; border-radius: 999px; border: none;
    background: var(--accent-grad); color: #fff; font-size: 11px; font-weight: 800;
    cursor: pointer; flex-shrink: 0;
  }

  /* 《企鵝的麻吉》8格海洋轉盤 */
  .game-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
  .game-title { font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  .round-pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--card-sub); border: 1px solid var(--glass-border); color: var(--text-sub); }
  .timer-pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(244, 63, 94, 0.2); border: 1px solid rgba(244, 63, 94, 0.55); color: #fda4af; }

  .wheel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .animal-cell {
    background: var(--card-sub); border: 1.5px solid var(--glass-border);
    border-radius: 12px; padding: 6px 4px; text-align: center; cursor: pointer;
    position: relative; transition: transform 0.1s, border-color 0.15s;
  }
  .animal-cell:active { transform: scale(0.95); }
  .animal-cell.selected { border-color: var(--gold-hi); background: rgba(251, 191, 36, 0.14); }
  .animal-cell.cursor { border-color: #38bdf8; box-shadow: 0 0 14px rgba(56, 189, 248, 0.85); transform: scale(1.03); }
  .animal-cell.winner { border-color: #facc15; background: rgba(250, 204, 21, 0.28); box-shadow: 0 0 18px rgba(250, 204, 21, 0.9); }
  .animal-mult { position: absolute; top: 3px; right: 5px; font-size: 9px; font-weight: 800; color: var(--gold-hi); }
  .animal-emoji { font-size: 22px; line-height: 1.2; margin-top: 4px; }
  .animal-name { font-size: 10px; font-weight: 800; margin-top: 2px; }
  .animal-bet { font-size: 9px; color: #38bdf8; font-weight: 800; min-height: 12px; }

  .bet-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 7px; }
  .chip-btn {
    padding: 7px 2px; border-radius: 999px; font-size: 11px; font-weight: 900;
    border: 1px solid var(--glass-border); background: var(--card-sub); color: var(--text-main);
    cursor: pointer; text-align: center;
  }
  .chip-btn.active { background: var(--gold-grad); color: #1f1600; border-color: #fef08a; }
  .chip-btn.spin-now { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; border: none; }

  .history-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--card-sub); border: 1px solid var(--glass-border);
    border-radius: 10px; padding: 5px 8px; font-size: 10px;
  }
  .history-icons { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1; }
  .hist-badge {
    padding: 2px 5px; border-radius: 6px; background: rgba(255,255,255,0.06);
    white-space: nowrap; font-weight: 700;
  }

  /* 盲盒卡片網格 */
  .box-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .box-card {
    background: var(--card-sub); border: 1px solid var(--glass-border-strong);
    border-radius: 14px; padding: 10px; text-align: center;
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  }
  .box-icon { font-size: 32px; }
  .box-title { font-size: 13px; font-weight: 800; }
  .box-price { font-size: 11px; font-weight: 800; color: var(--gold-hi); }
  .box-btns { display: flex; gap: 5px; }
  .box-open-btn {
    flex: 1; padding: 6px 4px; border-radius: 9px; border: none;
    background: var(--accent-grad); color: #fff; font-size: 11px; font-weight: 800; cursor: pointer;
  }
  .box-open-btn.ten { background: var(--gold-grad); color: #1f1600; }

  /* 禮物牆網格 */
  .gift-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .gift-card {
    background: var(--card-sub); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 8px 6px; text-align: center; cursor: pointer;
  }
  .gift-card:active { transform: scale(0.95); border-color: var(--gold-hi); }
  .gift-icon { font-size: 26px; }
  .gift-name { font-size: 11px; font-weight: 800; margin-top: 3px; }
  .gift-cost { font-size: 10px; color: var(--gold-hi); font-weight: 700; margin-top: 2px; }

  /* 1:1 精細立體盾牌六階爵位（無下方特權列表） */
  .nobility-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .nobility-card {
    background: var(--card-sub); border: 1.5px solid var(--glass-border-strong);
    border-radius: 16px; padding: 12px 10px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .nobility-card.owned { border-color: var(--gold-hi); box-shadow: 0 0 18px rgba(251, 191, 36, 0.25); }
  .shield-1to1 {
    width: 72px; height: 72px; aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
  }
  .nob-name { font-size: 14px; font-weight: 900; }
  .nob-price { font-size: 11px; font-weight: 800; color: var(--gold-hi); }
  .nob-btn {
    width: 100%; padding: 6px; border-radius: 999px; border: none;
    background: var(--gold-grad); color: #1f1600; font-size: 11px; font-weight: 900; cursor: pointer;
  }

  /* 私人房與好友列表 */
  .list-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--card-sub); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 9px 10px;
  }
  .section-title { font-size: 13px; font-weight: 900; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }

  /* 底部導覽列 */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 6px 8px calc(env(safe-area-inset-bottom, 8px) + 6px);
    background: var(--nav-bg); border-top: 1px solid var(--glass-border);
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; z-index: 30;
  }
  .nav-btn {
    border: none; background: transparent; color: var(--text-muted);
    border-radius: 12px; padding: 6px 2px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; font-weight: 700; cursor: pointer;
  }
  .nav-btn.active { background: var(--accent-grad); color: #fff; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4); }
  .nav-ico { font-size: 16px; line-height: 1.1; }

  /* 彈窗與 Toast */
  .modal-mask {
    position: absolute; inset: 0; background: rgba(4, 4, 14, 0.78);
    backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center;
    padding: 16px; z-index: 50;
  }
  .modal-mask.show { display: flex; }
  .modal-card {
    width: 100%; max-width: 390px; max-height: 82dvh; overflow-y: auto;
    background: var(--glass-elevated); border: 1px solid var(--glass-border-strong);
    border-radius: 18px; padding: 14px; color: var(--text-main);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; font-weight: 900; }
  .close-x { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-weight: 800; }

  .toast {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.94); border: 1px solid var(--gold-hi);
    color: #fef08a; padding: 7px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 800; z-index: 80; display: none; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .toast.show { display: block; }

  .field-input {
    width: 100%; background: var(--card-sub); border: 1px solid var(--glass-border);
    border-radius: 10px; padding: 8px 10px; color: var(--text-main); font-size: 12px; outline: none; margin-bottom: 8px;
  }
  .primary-btn {
    width: 100%; padding: 9px; border-radius: 10px; border: none;
    background: var(--accent-grad); color: #fff; font-size: 12px; font-weight: 800; cursor: pointer;
  }
</style>
</head>
<body>
<div class="app-shell">
  <div id="toast" class="toast"></div>

  <!-- 頂部欄 -->
  <header class="top-bar">
    <div class="brand-left">
      <div class="logo-badge">企鵝</div>
      <div>
        <div class="brand-title">
          <span id="theme-title-text">企鵝 · 星河藍紫樂園</span>
          <span id="role-badge" class="role-pill" onclick="openAdminGate()">會員</span>
        </div>
        <div class="brand-sub">
          <span id="user-id-label">ID:100001</span>
          <span><i class="sync-dot"></i> 即時同步</span>
        </div>
      </div>
    </div>
    <div class="top-actions">
      <button class="pill-btn" onclick="toggleTheme()">🎨 換色</button>
    </div>
  </header>

  <!-- 主內容 -->
  <main class="main-scroll">
    <!-- 1. 大廳 -->
    <section id="panel-hall" class="tab-panel active">
      <!-- 個人狀態卡 -->
      <div class="glass-card">
        <div class="profile-row">
          <div class="avatar-wrap" id="my-avatar-box" onclick="openProfileModal()">🐧</div>
          <div class="profile-mid">
            <div class="name-line">
              <span class="user-nick" id="my-nick-display">企鵝小萌主</span>
              <button class="mini-chip" onclick="openProfileModal()">🪪 帳號</button>
              <button class="mini-chip" onclick="openBackpackModal()">🎒 背包 <span id="bag-count-badge">0</span></button>
            </div>
            <div class="lvl-line">
              <button class="mini-chip gold" id="my-nobility-chip" onclick="switchTab('nobility')">👑 開通爵位</button>
              <span class="lvl-badge" id="wealth-lvl-badge">💎 Lv.1</span>
              <span class="lvl-badge" id="charm-lvl-badge">💖 Lv.1</span>
            </div>
          </div>
          <div class="diamond-box">
            <div class="diamond-lbl">我的鑽石</div>
            <div class="diamond-val" id="my-diamonds-display">500,000</div>
          </div>
        </div>
      </div>

      <!-- 語音麥位與房間公屏 -->
      <div class="glass-card">
        <div class="room-header">
          <div class="room-name">🌊 <span id="current-room-title">星河海洋大廳</span></div>
          <button class="mini-chip" onclick="triggerWelcomeBanner()">✨ 進房播報</button>
        </div>
        <div class="mic-grid" id="mic-grid"></div>
        <div style="height:8px;"></div>
        <div id="welcome-banner" class="welcome-banner"></div>
        <div class="chat-box" id="chat-box"></div>
        <div class="chat-input-row">
          <button id="mic-toggle-btn" class="mic-toggle-btn" onclick="toggleMicMute()">🎙️ 開麥</button>

<script>

const ANIMALS = [

  },
  {

    rewards: [
      { name: '星雲流光披風', icon: '🌠', value: 25000 },

      { name: '永恆星河之主稱號', icon: '✨', value: 268888 }
    ]
  }
];

function createDefaultState() {
  return {
    theme: 'bluepurple',
    isAdmin: false,
    user: {
      id: '100001',
      nick: '企鵝小萌主',
      avatar: '🐧',
      avatarImg: '',
      diamonds: 500000,
      wealthExp: 0,
      charmExp: 0,
      nobility: ''
    },
    // 背包預設完全空白，僅開盲盒後寫入
    backpack: [],
    blindboxes: JSON.parse(JSON.stringify(DEFAULT_BLINDBOXES)),
    fishBossRatio: 82, // 魚群機率 %（剩餘為霸主機率）
    selectedChip: 50,
    currentBets: {},
    lastBets: {},
    roundIndex: 1,
    countdown: 25,
    isSpinning: false,
    history: [
      { round: 1, animalId: 0 },
      { round: 2, animalId: 4 },
      { round: 3, animalId: 1 }
    ],
    mics: [
      { slot: 1, nick: '房主·星河', avatar: '🐧', speaking: true },
      { slot: 2, nick: '小八', avatar: '🐱', speaking: false },
      { slot: 3, nick: '', avatar: '', speaking: false },
      { slot: 4, nick: '', avatar: '', speaking: false },
      { slot: 5, nick: '', avatar: '', speaking: false },
      { slot: 6, nick: '', avatar: '', speaking: false },
      { slot: 7, nick: '', avatar: '', speaking: false },
      { slot: 8, nick: '', avatar: '', speaking: false }
    ],
    micOn: false,
    currentRoom: '星河海洋大廳',
    rooms: [
      { id: 'r1', name: '星河海洋大廳', host: '企鵝官方', online: 28, locked: false },
      { id: 'r2', name: '深夜聽歌小窩', host: '小八', online: 6, locked: false },
      { id: 'r3', name: '麻吉開獎衝榜房', host: '海豚寶寶', online: 14, locked: false }
    ],
    friends: [
      { id: '100002', nick: '小八', avatar: '🐱', online: true, messages: ['嗨！一起來玩企鵝的麻吉嗎？'] },
      { id: '100003', nick: '星河海豚', avatar: '🐬', online: true, messages: ['剛剛開盲盒出了稀有道具！'] }
    ],
    chats: [
      { tag: '系統', nick: '海洋精靈', text: '歡迎來到《企鵝的麻吉》，祝大家歐氣滿滿！' }
    ],
    cloudUrl: ''
  };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return createDefaultState();
    const parsed = JSON.parse(raw);
    const base = createDefaultState();
    const merged = Object.assign(base, parsed);
    merged.user = Object.assign(base.user, parsed.user || {});
    // 確保背包為陣列，未開盲盒前維持空陣列
    if (!Array.isArray(merged.backpack)) merged.backpack = [];
    if (!Array.isArray(merged.blindboxes) || !merged.blindboxes.length) {
      merged.blindboxes = JSON.parse(JSON.stringify(DEFAULT_BLINDBOXES));
    }
    return merged;
  } catch (e) {
    return createDefaultState();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function formatNum(n) {
  const v = Math.floor(Number(n || 0));
  if (v >= 100000000) return (v / 100000000).toFixed(v % 100000000 === 0 ? 0 : 1) + '億';
  if (v >= 100000) return (v / 10000).toFixed(v % 10000 === 0 ? 0 : 1) + '萬';
  return v.toLocaleString();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function toggleTheme() {
  state.theme = state.theme === 'bluepurple' ? 'blackgold' : 'bluepurple';
  applyTheme();
  saveState();
}

function applyTheme() {
  const isBG = state.theme === 'blackgold';
  document.body.classList.toggle('theme-blackgold', isBG);
  document.getElementById('theme-title-text').textContent = isBG ? '企鵝 · 黑金奢華樂園' : '企鵝 · 星河藍紫樂園';
}

function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const panel = document.getElementById('panel-' + tab);
  const btn = document.querySelector(`.nav-btn[data-tab="${tab}"]`);
  if (panel) panel.classList.add('active');
  if (btn) btn.classList.add('active');
}

function getNobilityObj() {
  return NOBILITY_TIERS.find(t => t.id === state.user.nobility) || null;
}

function renderProfile() {
  document.getElementById('user-id-label').textContent = 'ID:' + state.user.id;
  document.getElementById('my-nick-display').textContent = state.user.nick;
  document.getElementById('my-diamonds-display').textContent = formatNum(state.user.diamonds);

  const avBox = document.getElementById('my-avatar-box');
  avBox.innerHTML = state.user.avatarImg
    ? `<img src="${state.user.avatarImg}" alt="avatar" />`
    : state.user.avatar;

  const wLvl = Math.max(1, Math.floor(Math.sqrt(state.user.wealthExp / 100)) + 1);
  const cLvl = Math.max(1, Math.floor(Math.sqrt(state.user.charmExp / 100)) + 1);
  document.getElementById('wealth-lvl-badge').textContent = `💎 Lv.${wLvl}`;
  document.getElementById('charm-lvl-badge').textContent = `💖 Lv.${cLvl}`;

  const nob = getNobilityObj();
  document.getElementById('my-nobility-chip').textContent = nob ? `👑 ${nob.name}` : '👑 開通爵位';

  const roleEl = document.getElementById('role-badge');
  roleEl.textContent = state.isAdmin ? '管理員' : '會員';
  roleEl.classList.toggle('is-admin', state.isAdmin);

  const totalBagCount = state.backpack.reduce((sum, item) => sum + (item.count || 1), 0);
  document.getElementById('bag-count-badge').textContent = totalBagCount;
  const b2 = document.getElementById('bag-count-badge-2');
  if (b2) b2.textContent = totalBagCount;
}

/* 麥位與公屏 */
function renderMics() {
  const grid = document.getElementById('mic-grid');
  grid.innerHTML = state.mics.map((m, idx) => `
    <div class="mic-slot ${m.nick ? 'occupied' : ''} ${m.speaking ? 'speaking' : ''}" onclick="toggleMicSlot(${idx})">
      <div class="mic-avatar">${m.nick ? m.avatar : '➕'}</div>
      <div class="mic-nick">${m.nick || (idx + 1) + '號麥'}</div>
    </div>
  `).join('');
}

function toggleMicSlot(idx) {
  const slot = state.mics[idx];
  if (slot.nick === state.user.nick) {
    slot.nick = '';
    slot.avatar = '';
    slot.speaking = false;
    showToast('已下麥休息');
  } else if (!slot.nick) {
    state.mics.forEach(m => { if (m.nick === state.user.nick) { m.nick = ''; m.avatar = ''; m.speaking = false; } });
    slot.nick = state.user.nick;
    slot.avatar = state.user.avatar;
    slot.speaking = state.micOn;
    showToast(`已登上 ${idx + 1} 號語音麥位`);
  } else {
    showToast(`${slot.nick} 正在麥上`);
  }
  renderMics();
  saveState();
}

function toggleMicMute() {
  state.micOn = !state.micOn;
  const btn = document.getElementById('mic-toggle-btn');
  btn.textContent = state.micOn ? '🎙️ 麥克風中' : '🎙️ 開麥';
  btn.classList.toggle('on', state.micOn);
  state.mics.forEach(m => { if (m.nick === state.user.nick) m.speaking = state.micOn; });
  renderMics();
  saveState();
}

function triggerWelcomeBanner() {
  const nob = getNobilityObj();
  const titleTag = nob ? `【${nob.name}】` : '【貴賓】';
  const banner = document.getElementById('welcome-banner');
  banner.textContent = `✨ 歡迎 ${titleTag}${state.user.nick} 進入「${state.currentRoom}」！`;
  banner.classList.remove('show');
  void banner.offsetWidth;
  banner.classList.add('show');
  addChat('進房', state.user.nick, `華麗駕到「${state.currentRoom}」✨`);
}

function addChat(tag, nick, text) {
  state.chats.push({ tag, nick, text });
  if (state.chats.length > 40) state.chats.shift();
  renderChats();
  saveState();
}

function renderChats() {
  const box = document.getElementById('chat-box');
  box.innerHTML = state.chats.map(c => `
    <div class="chat-msg"><span class="chat-tag">${c.tag}</span><b>${c.nick}：</b><span>${c.text}</span></div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function sendChat() {
  const inp = document.getElementById('chat-input');
  const txt = inp.value.trim();
  if (!txt) return;
  const nob = getNobilityObj();
  addChat(nob ? nob.name : 'Lv', state.user.nick, txt);
  inp.value = '';
}

/* 《企鵝的麻吉》8格海洋轉盤 */
function renderWheel() {
  document.getElementById('round-label').textContent = `今日第 ${state.roundIndex} 輪`;
  const grid = document.getElementById('wheel-grid');
  grid.innerHTML = ANIMALS.map(a => {
    const bet = state.currentBets[a.id] || 0;
    return `
      <div class="animal-cell ${bet > 0 ? 'selected' : ''}" id="cell-${a.id}" onclick="placeBet(${a.id})">
        <span class="animal-mult">${a.mult}x</span>
        <div class="animal-emoji">${a.emoji}</div>
        <div class="animal-name">${a.name}</div>
        <div class="animal-bet">${bet > 0 ? '💎' + formatNum(bet) : ''}</div>
      </div>
    `;
  }).join('');

  const histBox = document.getElementById('history-icons');
  histBox.innerHTML = state.history.slice(-8).reverse().map(h => {
    const a = ANIMALS[h.animalId] || ANIMALS[0];
    return `<span class="hist-badge">${a.emoji}${a.mult}x</span>`;
  }).join('');
}

function selectChip(val, btn) {
  state.selectedChip = val;
  document.querySelectorAll('.chip-btn[data-chip]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function placeBet(animalId) {
  if (state.isSpinning) return;
  const cost = state.selectedChip;
  if (state.user.diamonds < cost) {
    showToast('鑽石不足，管理員後台可補充鑽石');
    return;
  }
  state.user.diamonds -= cost;
  state.user.wealthExp += cost;
  state.currentBets[animalId] = (state.currentBets[animalId] || 0) + cost;
  renderProfile();
  renderWheel();
  saveState();
}

function repeatLastBet() {
  if (state.isSpinning) return;
  const entries = Object.entries(state.lastBets || {});
  if (!entries.length) {
    showToast('上一輪沒有投注記錄');
    return;
  }
  const total = entries.reduce((s, [, v]) => s + v, 0);
  if (state.user.diamonds < total) {
    showToast('鑽石不足以重複上一輪投注');
    return;
  }
  state.user.diamonds -= total;
  state.user.wealthExp += total;
  entries.forEach(([id, v]) => {
    state.currentBets[id] = (state.currentBets[id] || 0) + v;
  });
  renderProfile();
  renderWheel();
  saveState();
  showToast('已重複上一輪投注');
}

function pickWinningAnimal() {
  const fishProb = Math.min(98, Math.max(2, Number(state.fishBossRatio || 82))) / 100;
  const isFish = Math.random() < fishProb;
  const pool = ANIMALS.filter(a => a.type === (isFish ? 'fish' : 'boss'));
  const totalW = pool.reduce((s, a) => s + a.weight, 0);
  let r = Math.random() * totalW;
  for (const a of pool) {
    r -= a.weight;
    if (r <= 0) return a;
  }
  return pool[0];
}

function spinNow() {
  if (state.isSpinning) return;
  state.isSpinning = true;
  const winner = pickWinningAnimal();
  const totalSteps = 16 + winner.id;
  let step = 0;

  const timer = setInterval(() => {
    document.querySelectorAll('.animal-cell').forEach(c => c.classList.remove('cursor', 'winner'));
    const curId = step % 8;
    const cell = document.getElementById('cell-' + curId);
    if (cell) cell.classList.add('cursor');

    if (step >= totalSteps) {
      clearInterval(timer);
      document.querySelectorAll('.animal-cell').forEach(c => c.classList.remove('cursor'));
      const winCell = document.getElementById('cell-' + winner.id);
      if (winCell) winCell.classList.add('winner');

      const betOnWin = state.currentBets[winner.id] || 0;
      const prize = betOnWin * winner.mult;
      if (prize > 0) {
        state.user.diamonds += prize;
        showToast(`🎉 開出【${winner.name}】！贏得 ${formatNum(prize)} 鑽石`);
        addChat('喜報', state.user.nick, `在《企鵝的麻吉》猜中 ${winner.emoji}${winner.name} 贏得 ${formatNum(prize)} 鑽石！`);
      } else {
        showToast(`本輪開出 ${winner.emoji} ${winner.name} (${winner.mult}x)`);
      }

      state.history.push({ round: state.roundIndex, animalId: winner.id });
      if (state.history.length > 30) state.history.shift();
      if (Object.keys(state.currentBets).length > 0) {
        state.lastBets = Object.assign({}, state.currentBets);
      }
      state.currentBets = {};
      state.roundIndex += 1;
      state.countdown = 25;
      state.isSpinning = false;
      renderProfile();
      renderWheel();
      saveState();
    }
    step++;
  }, 85);
}

/* 25秒自動倒數計時器 */
setInterval(() => {
  if (state.isSpinning) return;
  state.countdown -= 1;
  if (state.countdown <= 0) {
    spinNow();
    return;
  }
  const pill = document.getElementById('game-timer-pill');
  if (pill) pill.textContent = `請選擇 ${state.countdown}s`;
}, 1000);

/* 盲盒與背包系統（背包預設全空，僅開盲盒才寫入背包） */
function renderBlindBoxes() {
  const grid = document.getElementById('blindbox-grid');
  grid.innerHTML = state.blindboxes.map((box, idx) => `
    <div class="box-card">
      <div class="box-icon">${box.icon}</div>
      <div class="box-title">${box.name}</div>
      <div class="box-price">💎 ${formatNum(box.price)} / 次</div>
      <div class="box-btns">
        <button class="box-open-btn" onclick="openBlindBox(${idx}, 1)">開 1 個</button>
        <button class="box-open-btn ten" onclick="openBlindBox(${idx}, 10)">十連開</button>
      </div>
    </div>
  `).join('');
}

function openBlindBox(boxIdx, times) {
  const box = state.blindboxes[boxIdx];
  if (!box) return;
  const totalCost = box.price * times;
  if (state.user.diamonds < totalCost) {
    showToast('鑽石不足，無法開啟盲盒');
    return;
  }
  state.user.diamonds -= totalCost;
  state.user.wealthExp += totalCost;

  const wonList = [];
  for (let i = 0; i < times; i++) {
    const reward = box.rewards[Math.floor(Math.random() * box.rewards.length)];
    wonList.push(reward);
    pushRewardToBackpack(reward, box.name);
  }

  renderProfile();
  saveState();

  const summaryHtml = wonList.map(r => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--card-sub);border-radius:10px;margin-bottom:5px;">
      <span>${r.icon} <b>${r.name}</b></span>
      <span style="color:var(--gold-hi);font-size:11px;">已存入背包</span>
    </div>
  `).join('');

  openModal(`🎉 ${box.name} 開獎結果`, `
    <div style="font-size:11px;color:var(--text-sub);margin-bottom:8px;">所有抽中的獎勵已直接放入你的背包中：</div>
    ${summaryHtml}
    <button class="primary-btn" style="margin-top:8px;" onclick="openBackpackModal()">立即打開背包查看</button>
  `);
}

function pushRewardToBackpack(reward, boxName) {
  if (!Array.isArray(state.backpack)) state.backpack = [];
  const existing = state.backpack.find(it => it.name === reward.name && it.boxName === boxName);
  if (existing) {
    existing.count = (existing.count || 1) + 1;
  } else {
    state.backpack.push({
      id: 'bag_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      name: reward.name,
      icon: reward.icon || '🎁',
      value: Number(reward.value || 0),
      boxName: boxName || '盲盒',
      count: 1
    });
  }
}

function openBackpackModal() {
  if (!Array.isArray(state.backpack) || state.backpack.length === 0) {
    openModal('🎒 我的背包', `
      <div style="text-align:center;padding:24px 10px;color:var(--text-muted);font-size:12px;">
        <div style="font-size:34px;margin-bottom:8px;">🎒</div>
        目前背包裡空空如也～<br/>前往「盲盒」開啟盲盒，抽到的獎勵會直接存放在這裡！
      </div>
      <button class="primary-btn" onclick="closeModal();switchTab('blindbox')">前往開盲盒</button>
    `);
    return;
  }

  const itemsHtml = state.backpack.map((item, idx) => `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--card-sub);border:1px solid var(--glass-border);border-radius:12px;margin-bottom:6px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:24px;">${item.icon}</span>
        <div>
          <div style="font-size:12px;font-weight:800;">${item.name} <span style="color:var(--gold-hi);">x${item.count}</span></div>
          <div style="font-size:10px;color:var(--text-muted);">來源：${item.boxName} · 價值 💎${formatNum(item.value)}</div>
        </div>
      </div>
      <button class="mini-chip gold" onclick="giftFromBackpack(${idx})">贈送</button>
    </div>
  `).join('');

  openModal('🎒 我的背包（盲盒獎勵）', itemsHtml);
}

function giftFromBackpack(idx) {
  const item = state.backpack[idx];
  if (!item) return;
  state.user.charmExp += (item.value || 100);
  addChat('背包贈禮', state.user.nick, `送出了背包珍藏 ${item.icon}【${item.name}】！`);
  showToast(`已送出 ${item.name}，魅力值提升！`);
  if (item.count > 1) {
    item.count -= 1;
  } else {
    state.backpack.splice(idx, 1);
  }
  renderProfile();
  saveState();
  openBackpackModal();
}

/* 禮物牆 */
function renderGifts() {
  const grid = document.getElementById('gift-grid');
  grid.innerHTML = GIFTS.map(g => `
    <div class="gift-card" onclick="sendWallGift('${g.id}')">
      <div class="gift-icon">${g.icon}</div>
      <div class="gift-name">${g.name}</div>
      <div class="gift-cost">💎 ${formatNum(g.price)}</div>
    </div>
  `).join('');
}

function sendWallGift(giftId) {
  const g = GIFTS.find(x => x.id === giftId);
  if (!g) return;
  if (state.user.diamonds < g.price) {
    showToast('鑽石不足，無法送出該禮物');
    return;
  }
  state.user.diamonds -= g.price;
  state.user.wealthExp += g.price;
  state.user.charmExp += g.price;
  renderProfile();
  saveState();
  addChat('豪禮', state.user.nick, `在房間送出 ${g.icon}【${g.name}】(💎${formatNum(g.price)})！`);
  showToast(`已送出 ${g.name}！`);
}

/* 1:1 精細立體盾牌六階爵位（無下方特權列表） */
function renderShieldSvg(tier) {
  return `
    <svg viewBox="0 0 100 100" width="72" height="72">
      <defs>
        <linearGradient id="grad-${tier.id}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${tier.c1}" />
          <stop offset="100%" stop-color="${tier.c2}" />
        </linearGradient>
      </defs>
      <path d="M50 6 L86 20 V48 C86 71 69 87 50 95 C31 87 14 71 14 48 V20 Z"
            fill="url(#grad-${tier.id})" stroke="#fde68a" stroke-width="3.5" />
      <path d="M50 14 L78 25 V47 C78 65 64 78 50 85 C36 78 22 65 22 47 V25 Z"
            fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
      <polygon points="50,28 63,46 50,68 37,46" fill="${tier.gem}" stroke="#ffffff" stroke-width="1.5" />
    </svg>
  `;
}

function renderNobility() {
  const grid = document.getElementById('nobility-grid');
  grid.innerHTML = NOBILITY_TIERS.map(t => {
    const isOwned = state.user.nobility === t.id;
    return `
      <div class="nobility-card ${isOwned ? 'owned' : ''}">
        <div class="shield-1to1">${renderShieldSvg(t)}</div>
        <div class="nob-name">${t.name}</div>
        <div class="nob-price">💎 ${formatNum(t.price)}</div>
        <button class="nob-btn" onclick="buyNobility('${t.id}')">${isOwned ? '已佩戴' : '立即開通'}</button>
      </div>
    `;
  }).join('');
}

function buyNobility(id) {
  const tier = NOBILITY_TIERS.find(t => t.id === id);
  if (!tier) return;
  if (state.user.nobility === id) {
    showToast(`你已擁有【${tier.name}】爵位`);
    return;
  }
  if (state.user.diamonds < tier.price) {
    showToast('鑽石不足，可先到管理員後台發放鑽石');
    return;
  }
  state.user.diamonds -= tier.price;
  state.user.wealthExp += tier.price;
  state.user.nobility = id;
  renderProfile();
  renderNobility();
  saveState();
  triggerWelcomeBanner();
  showToast(`👑 恭喜晉升為尊貴【${tier.name}】！`);
}

/* 私人房與好友 */
function renderRooms() {
  const list = document.getElementById('room-list');
  list.innerHTML = state.rooms.map(r => `
    <div class="list-item">
      <div>
        <div style="font-size:13px;font-weight:800;">🌊 ${r.name}</div>
        <div style="font-size:10px;color:var(--text-muted);">房主：${r.host} · 在線 ${r.online} 人</div>
      </div>
      <button class="mini-chip gold" onclick="enterRoom('${r.name}')">進入房間</button>
    </div>
  `).join('');
}

function enterRoom(name) {
  state.currentRoom = name;
  document.getElementById('current-room-title').textContent = name;
  switchTab('hall');
  triggerWelcomeBanner();
  saveState();
}

function createPrivateRoom() {
  openModal('🏠 建立私人語音房', `
    <input id="new-room-name" class="field-input" placeholder="輸入私人房間名稱（例如：小八的語音小窩）" />
    <button class="primary-btn" onclick="confirmCreateRoom()">立即建立並進入</button>
  `);
}

function confirmCreateRoom() {
  const name = document.getElementById('new-room-name').value.trim();
  if (!name) return;
  state.rooms.unshift({ id: 'r_' + Date.now(), name, host: state.user.nick, online: 1, locked: false });
  renderRooms();
  closeModal();
  enterRoom(name);
}

function renderFriends() {
  const list = document.getElementById('friend-list');
  list.innerHTML = state.friends.map((f, idx) => `
    <div class="list-item">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:24px;">${f.avatar}</span>
        <div>
          <div style="font-size:13px;font-weight:800;">${f.nick} <span style="font-size:10px;color:#34d399;">● 在線</span></div>
          <div style="font-size:10px;color:var(--text-muted);">ID:${f.id}</div>
        </div>
      </div>
      <button class="mini-chip" onclick="openPmModal(${idx})">💬 私聊</button>
    </div>
  `).join('');
}

function openPmModal(idx) {
  const f = state.friends[idx];
  if (!f) return;
  const msgs = f.messages.map(m => `<div style="padding:6px 8px;background:var(--card-sub);border-radius:8px;margin-bottom:5px;font-size:11px;">${m}</div>`).join('');
  openModal(`💬 與 ${f.nick} 私聊`, `
    <div style="max-height:180px;overflow-y:auto;margin-bottom:8px;">${msgs}</div>
    <div style="display:flex;gap:6px;">
      <input id="pm-inp" class="field-input" style="margin:0;" placeholder="輸入私聊訊息..." />
      <button class="send-btn" onclick="sendPm(${idx})">發送</button>
    </div>
  `);
}

function sendPm(idx) {
  const inp = document.getElementById('pm-inp');
  const txt = inp.value.trim();
  if (!txt) return;
  state.friends[idx].messages.push(`我：${txt}`);
  saveState();
  openPmModal(idx);
}

function addDemoFriend() {
  openModal('➕ 搜尋 ID 新增好友', `
    <input id="add-fid-inp" class="field-input" placeholder="輸入對方暱稱或 ID" />
    <button class="primary-btn" onclick="confirmAddFriend()">發送好友申請</button>
  `);
}

function confirmAddFriend() {
  const val = document.getElementById('add-fid-inp').value.trim();
  if (!val) return;
  state.friends.push({ id: String(100000 + Math.floor(Math.random() * 900)), nick: val, avatar: '🐧', online: true, messages: ['我們已經成為好友啦！'] });
  renderFriends();
  saveState();
  closeModal();
  showToast(`已成功新增好友【${val}】`);
}

/* 個人帳號編輯與往輪記錄 */
function openProfileModal() {
  openModal('🪪 個人帳號設定', `
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">我的暱稱</div>
    <input id="edit-nick-inp" class="field-input" value="${state.user.nick}" />
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">上傳自訂頭像圖片（可選）</div>
    <input type="file" accept="image/*" class="field-input" onchange="handleAvatarUpload(event)" />
    <button class="primary-btn" onclick="saveProfileEdit()">儲存帳號資料</button>
  `);
}

function handleAvatarUpload(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.user.avatarImg = reader.result;
    renderProfile();
    saveState();
    showToast('頭像已更新');
  };
  reader.readAsDataURL(file);
}

function saveProfileEdit() {
  const nick = document.getElementById('edit-nick-inp').value.trim();
  if (nick) state.user.nick = nick;
  renderProfile();
  saveState();
  closeModal();
  showToast('帳號設定已儲存');
}

function openHistoryModal() {
  const rows = state.history.slice().reverse().map(h => {
    const a = ANIMALS[h.animalId] || ANIMALS[0];
    return `<div style="display:flex;justify-content:space-between;padding:6px 8px;background:var(--card-sub);border-radius:8px;margin-bottom:4px;font-size:11px;">
      <span>第 ${h.round} 輪</span>
      <span>${a.emoji} <b>${a.name}</b> (${a.mult}x)</span>
    </div>`;
  }).join('');
  openModal('📜 《企鵝的麻吉》開獎記錄', rows || '<div style="font-size:12px;">暫無記錄</div>');
}

/* 管理員後台（密碼 8888） */
function openAdminGate() {
  if (state.isAdmin) {
    openAdminPanel();
    return;
  }
  openModal('🔐 管理員權限驗證', `
    <div style="font-size:11px;color:var(--text-sub);margin-bottom:8px;">一般訪客預設為會員模式；請輸入管理員密碼解鎖後台：</div>
    <input id="admin-pwd-inp" type="password" class="field-input" placeholder="請輸入管理員密碼" />
    <button class="primary-btn" onclick="verifyAdminPwd()">解鎖管理員後台</button>
  `);
}

function verifyAdminPwd() {
  const pwd = document.getElementById('admin-pwd-inp').value.trim();
  if (pwd === '8888') {
    state.isAdmin = true;
    renderProfile();
    saveState();
    openAdminPanel();
    showToast('已解鎖管理員後台');
  } else {
    showToast('密碼錯誤');
  }
}

function openAdminPanel() {
  openModal('⚙️ 企鵝管理員控制後台', `
    <div style="font-size:12px;font-weight:800;margin-bottom:4px;">1. 鑽石發放與背包清理</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;">
      <button class="primary-btn" onclick="adminAddDiamonds(1000000)">＋100萬鑽石</button>
      <button class="primary-btn" style="background:linear-gradient(135deg,#f59e0b,#d97706);" onclick="adminAddDiamonds(10000000000)">＋100億鑽石</button>
    </div>

    <div style="font-size:12px;font-weight:800;margin-bottom:4px;">2. 魚群與霸主開獎機率（目前魚群 ${state.fishBossRatio}% / 霸主 ${100 - state.fishBossRatio}%）</div>
    <input id="adm-ratio-inp" type="number" min="5" max="98" class="field-input" value="${state.fishBossRatio}" />
    <button class="primary-btn" style="margin-bottom:10px;" onclick="adminSaveRatio()">儲存機率設定</button>

    <div style="font-size:12px;font-weight:800;margin-bottom:4px;">3. 切回一般會員檢視</div>
    <button class="primary-btn" style="background:#334155;" onclick="state.isAdmin=false;renderProfile();saveState();closeModal();showToast('已切換回一般會員模式')">鎖定後台（切回會員）</button>
  `);
}

function adminAddDiamonds(amount) {
  state.user.diamonds += amount;
  renderProfile();
  saveState();
  showToast(`已發放 ${formatNum(amount)} 鑽石！`);
}

function adminSaveRatio() {
  const v = Number(document.getElementById('adm-ratio-inp').value || 82);
  state.fishBossRatio = Math.min(98, Math.max(5, v));
  saveState();
  showToast(`已更新魚群機率為 ${state.fishBossRatio}%`);
  openAdminPanel();
}

function openModal(title, html) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-mask').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-mask').classList.remove('show');
}

/* 初始化全部畫面 */
applyTheme();
renderProfile();
renderMics();
renderChats();
renderWheel();
renderBlindBoxes();
renderGifts();
renderNobility();
renderRooms();
renderFriends();
</script>
</body>
</html>
